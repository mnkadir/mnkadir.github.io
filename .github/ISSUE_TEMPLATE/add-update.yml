name: Add a website update
description: Add a conference, seminar talk, certificate, interview, award or news item to the website.
title: "[Update] "
labels: ["site-update"]
body:
  - type: markdown
    attributes:
      value: |
        Fill in this form and press **Create** (or **Submit new issue**) at the bottom.
        The website updates itself in about two minutes. You do not need to edit any code.
  - type: dropdown
    id: type
    attributes:
      label: Type
      description: What kind of update is this?
      options:
        - Conference presentation
        - Seminar or talk
        - Research figure or poster
        - Fieldwork or lab photos
        - Video (talk, lecture or recording)
        - Training or certificate
        - Media or interview
        - Award or recognition
        - News
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: Title
      description: A short headline, shown in bold on the website.
      placeholder: "Oral presentation at the AGU Fall Meeting 2026"
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Date
      description: "Write it as year-month-day. Month only (2026-12) or year only (2026) also works."
      placeholder: "2026-12-14"
    validations:
      required: true
  - type: input
    id: place
    attributes:
      label: Event or place
      description: Optional. The event name, organisation or city.
      placeholder: "AGU Fall Meeting, New Orleans, USA"
  - type: textarea
    id: summary
    attributes:
      label: Short description
      description: Optional. One to three sentences.
  - type: input
    id: link
    attributes:
      label: Link
      description: Optional. A web link such as a YouTube video, news article, event page or paper. Any item with a YouTube link also appears in the Video archive on the home page and plays there. For a research figure, paste the link to the paper.
      placeholder: "https://www.youtube.com/watch?v=..."
  - type: textarea
    id: photos
    attributes:
      label: Photos or certificate
      description: Optional. Click inside this box, then drag and drop your photos or figure image (JPG or PNG) or a PDF certificate. Wait until each upload finishes before you submit. The first photo is the cover. All photos of one event become one album in the Gallery.
  - type: textarea
    id: captions
    attributes:
      label: Photo captions
      description: Optional. One line per photo, in the same order as the photos above. Leave empty to use the title for every photo.
      placeholder: |
        Presenting my poster in the exhibit hall
        With the MACH team after the session
  - type: dropdown
    id: project
    attributes:
      label: Show on a research project
      description: Optional. The photos will also appear beside this project on the Research page.
      options:
        - "No"
        - Estuary bathymetry and flood risk (MACH)
        - Flow–vegetation interactions (UF Watershed Ecology Lab)
        - Old Brahmaputra adaptive decision tool
        - Deltas under Pressure (Wageningen)
        - GBM delta hydrodynamics, sediment and floods
        - Water quality, salinity and climate adaptation
